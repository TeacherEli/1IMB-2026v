<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/login.js" defer></script>
</head>
<body>
    <div class="formContainer">
        <h1>Logg inn</h1>
        <form action="">
            <div class="formSection">
                <label for="">Navn</label>
                <input type="text" id="name">
            </div>
            <div class="formSection">
                <label for="">Email</label>
                <input type="email" id="email">
            </div>
             <div class="formSection">
                <label for="">Passord</label>
                <input type="password" id="password" onkeyup="checkPassword()">
            </div>
             <div class="formSection">
                <label for="">Valider passord</label>
                <input type="text" id="validatePassword" onkeyup="checkPassword()">
                <p id="feedback"></p>
            </div>

        </form>
        <button onclick="registrer()">Registrer</button>
        <p>Har alleredet bruker? <a href="./login.html">Login</a></p>
    </div>
</body>
</html>
